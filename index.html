<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            font-family: system-ui, sans-serif;
            color: #333;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .text-box {
            max-width: 600px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="text-box">
        我是一名计算机专业的学生，平时喜欢钻研代码，尝试不同方向的开发。享受一点点把想法变成可以运行的程序的过程，有空的时候会刷算法题、看技术文档，慢慢积累自己的能力。性格比较安静，乐于慢慢学习新东西，希望以后可以做出有意思、有价值的小项目。
    </div>

</html>
